<style>
/* Layout: sky-blue stage edge to edge; the two baby boxes lean in from the screen edges, invitation copy centred between them. */
:root{
  --sky:#b5d6da; --sky-soft:#cde5e8; --ink:#0b1a1c; --bar:#01110f; --bar-text:#d4ecee;
  --chip:rgba(255,255,255,.55); --chip-line:rgba(1,17,15,.22);
  --display:"Ribeye", Georgia, "Times New Roman", serif;
  --body:"Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bw:min(40vw, 27vh);
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
.art-src{position:absolute;width:0;height:0;overflow:hidden}
.stage{position:relative;min-height:100%;box-sizing:border-box;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-inline:16px;padding-block:calc(var(--bw)*1.25) calc(var(--bw)*.62)}
.p{position:absolute;display:block;max-width:none}
.baby{top:0;width:var(--bw);height:auto}
.baby-l{left:0} .baby-r{right:0}
.paci{top:2vh;left:50%;width:calc(var(--bw)*.3);margin-left:calc(var(--bw)*-.15)}
.onesie{display:none}
.rattle{left:4vw;bottom:3vh;width:calc(var(--bw)*.32)}
.pants{right:0;bottom:2vh;width:calc(var(--bw)*.5)}
.x{position:absolute;display:block;height:auto}
.x-duck,.x-rattle2{display:none}
.x-blocks{left:19vw;bottom:2vh;width:calc(var(--bw)*.48)}
.x-bottle{left:45vw;bottom:2.5vh;width:calc(var(--bw)*.19);transform:rotate(-14deg)}
.x-socks{right:21vw;bottom:2vh;width:calc(var(--bw)*.4)}
.actions{position:relative}
.m-x{position:absolute;display:block;height:auto;pointer-events:none}
.m-duck{left:50%;margin-left:110px;top:38%;width:calc(var(--bw)*.34)}
.m-rattle{left:50%;margin-left:calc(-152px - var(--bw)*.2);top:0;width:calc(var(--bw)*.2);transform:rotate(-16deg)}
@media (min-width:600px){.m-rattle{margin-left:calc(-235px - var(--bw)*.2)}.m-duck{margin-left:235px;top:25%}}
@media (max-width:379px){.m-rattle{display:none}}
@media (max-width:339px){.m-duck{display:none}}
.x text{font-family:var(--display)}
.deco{position:absolute;width:calc(var(--sz)*1px);height:calc(var(--sz)*1px);pointer-events:none}
.deco svg{width:100%;height:100%;display:block}
.spark svg{fill:#fff;opacity:.55}
.dot svg{fill:var(--sky-soft)}

.card{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:clamp(10px,2vh,22px);width:100%;max-width:640px;min-width:0}
h1{font-family:var(--display);font-weight:400;margin:0;line-height:.98;letter-spacing:.01em;
  font-size:clamp(2.5rem,13vw,4.2rem);text-wrap:balance}
h1 span{display:block}
.tag{margin:0;max-width:100%;box-sizing:border-box;background:var(--bar);color:var(--bar-text);font-size:clamp(.92rem,2vh,1.15rem);
  padding:.7em clamp(.9em,4vw,1.5em);letter-spacing:.01em}
@media (max-width:420px){.tag{font-size:.88rem}}
.when{margin:0;font-size:clamp(1.3rem,3.4vh,2.1rem);line-height:1.2;font-weight:400}
.when .time{display:block;font-weight:500}
.when .sep{display:none}
.where{margin:0;font-size:clamp(1rem,2.4vh,1.35rem)}
.actions{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:clamp(4px,1vh,12px)}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:.55em;font:500 1rem/1 var(--body);text-decoration:none;
  border-radius:999px;padding:.85em 1.35em;transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease}
.btn svg{width:1.2em;height:1.2em;flex:none}
.btn-primary{background:var(--bar);color:#fff;font-size:1.1rem;padding:1em 1.8em;box-shadow:0 4px 0 rgba(1,17,15,.18)}
.btn-ghost{background:var(--chip);color:var(--ink);border:1.5px solid var(--chip-line)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(1,17,15,.2)}
.btn-ghost:hover{background:#fff}
.btn:focus-visible{outline:3px solid var(--bar);outline-offset:3px}

/* wide screens: babies grow to fill the sides, onesie returns above the title */
@media (min-aspect-ratio:5/4){
  :root{--bh:min(56vh,620px)}
  .stage{padding-block:3vh 4vh}
  .baby{height:var(--bh);width:auto}
  .paci{top:4vh;left:calc(50% - min(30vh,330px));margin-left:0;width:auto;height:min(13vh,140px)}
  .onesie{display:block;position:static;height:min(20vh,220px);width:auto;transform-origin:50% 10%}
  .rattle{left:5vw;bottom:14vh;width:auto;height:min(18vh,190px)}
  .pants{bottom:9vh;width:auto;height:min(27vh,300px)}
  h1{font-size:clamp(3rem,min(10.5vh,7vw),7rem)}
  .actions{flex-direction:column}
  .x{display:block;width:auto;top:auto;bottom:auto;left:auto;right:auto}
  .m-x{display:none}
  .x-bottle{left:20vw;top:57vh;height:min(16vh,170px);transform:rotate(-14deg)}
  .x-blocks{left:13vw;bottom:3vh;height:min(14vh,150px)}
  .x-duck{right:16vw;top:57vh;height:min(11vh,120px)}
  .x-socks{right:17vw;bottom:3vh;height:min(12vh,130px)}
  .x-rattle2{left:62vw;top:4vh;height:min(14vh,150px);transform:rotate(18deg)}
  .when .time{display:inline}
  .when .sep{display:inline}
}

@media (prefers-reduced-motion:no-preference){
  .baby{animation:bob 3.4s ease-in-out infinite alternate}
  .baby-r{animation-delay:-1.7s}
  .paci{transform-origin:50% 8%;animation:swing 3s ease-in-out infinite alternate}
  .rattle{transform-origin:45% 5%;animation:swing 3.6s ease-in-out -1s infinite alternate}
  .onesie,.pants{animation:sway 4.2s ease-in-out infinite alternate}
  .pants{transform-origin:90% 0;animation-delay:-2s}
  .x-bottle{transform-origin:50% 100%;animation:tilt 4s ease-in-out infinite alternate}
  .m-duck{animation:bob 2.8s ease-in-out -.8s infinite alternate}
  .m-rattle{transform-origin:50% 95%;animation:swing3 3.2s ease-in-out infinite alternate}
  .x-duck{animation:bob 2.8s ease-in-out -.8s infinite alternate}
  .x-rattle2{transform-origin:50% 95%;animation:swing2 3.2s ease-in-out infinite alternate}
  .spark{animation:twinkle 2.8s ease-in-out infinite alternate}
  .spark:nth-of-type(3n){animation-delay:-1.2s}
}
@keyframes bob{to{transform:translateY(-7px)}}
@keyframes swing{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes tilt{from{transform:rotate(-18deg)}to{transform:rotate(-10deg)}}
@keyframes swing2{from{transform:rotate(12deg)}to{transform:rotate(24deg)}}
@keyframes swing3{from{transform:rotate(-22deg)}to{transform:rotate(-10deg)}}
@keyframes twinkle{from{opacity:.35;transform:scale(.85)}to{opacity:1;transform:scale(1)}}

.cover{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,22px);
  background:var(--sky);border:0;margin:0;padding:16px;width:100%;cursor:pointer;color:var(--ink);font-family:var(--body);
  transition:opacity .7s ease .9s, visibility 0s linear 1.6s}
.cover:focus-visible{outline:3px solid var(--bar);outline-offset:-8px}
.cover.gone{opacity:0;visibility:hidden;pointer-events:none}
.gift{width:min(62vw,42vh,320px);height:auto;overflow:visible}
.gift .lid{transform-box:fill-box;transform-origin:50% 100%;transition:transform .8s cubic-bezier(.3,1.4,.5,1),opacity .6s ease .35s}
.gift .heads{transition:transform .6s cubic-bezier(.3,1.5,.5,1) .25s}
.cover.opening .lid{transform:translate(18px,-90px) rotate(22deg);opacity:0}
.cover.opening .heads{transform:translateY(-22px)}
.cover h2{font-family:var(--display);font-weight:400;margin:0;font-size:clamp(1.8rem,min(6vh,8vw),3rem);line-height:1.05;text-align:center;text-wrap:balance}
.cover .tap{margin:0;font-size:clamp(1rem,2.4vh,1.25rem);font-weight:500;background:var(--bar);color:#fff;border-radius:999px;padding:.8em 1.6em;
  display:inline-flex;align-items:center;gap:.5em}
.cover .tap svg{width:1.1em;height:1.1em}
.cover .hint{margin:0;font-size:.9rem;opacity:.75}
.cover.opening .tap,.cover.opening .hint,.cover.opening h2{opacity:0;transition:opacity .3s ease}
html.locked,html.locked body{overflow:hidden}
.music{position:fixed;z-index:40;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:48px;height:48px;border-radius:50%;border:1.5px solid var(--chip-line);background:rgba(255,255,255,.75);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(1,17,15,.15);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  transition:transform .18s ease, background-color .18s ease}
.music:hover{transform:translateY(-2px);background:#fff}
.music:focus-visible{outline:3px solid var(--bar);outline-offset:3px}
.music svg{width:22px;height:22px}
.music .off{display:none}
.music[aria-pressed="false"] .on{display:none}
.music[aria-pressed="false"] .off{display:block}
.music[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){
  .cover:not(.opening) .tap{animation:pulse 1.6s ease-in-out infinite}
  .cover:not(.opening) .gift{animation:wiggle 2.4s ease-in-out infinite}
}
@media (prefers-reduced-motion:reduce){
  .gift .lid,.gift .heads{transition:none}
  .cover{transition:opacity .3s ease .2s, visibility 0s linear .5s}
}

<script>
(function(){
  var root=document.documentElement, cover=document.getElementById('cover'), btn=document.getElementById('music');
  root.classList.add('locked');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- music box (Twinkle Twinkle, public domain) ---- */
  var ctx=null, master=null, wet=null, timer=null, wantOn=true, nextT=0, idx=0, loopStart=0;
  var BPM=84, B=60/BPM;
  var M=[[72,1],[72,1],[79,1],[79,1],[81,1],[81,1],[79,2],[77,1],[77,1],[76,1],[76,1],[74,1],[74,1],[72,2],
         [79,1],[79,1],[77,1],[77,1],[76,1],[76,1],[74,2],[79,1],[79,1],[77,1],[77,1],[76,1],[76,1],[74,2],
         [72,1],[72,1],[79,1],[79,1],[81,1],[81,1],[79,2],[77,1],[77,1],[76,1],[76,1],[74,1],[74,1],[72,2]];
  var CH={C:[48,[55,64]],F:[53,[57,65]],G:[55,[59,62]]};
  var prog='C C F C F C G C C F C G C F C G C C F C F C G C'.split(' ');
  var ev=[], t=0;
  M.forEach(function(n){ev.push({t:t,m:n[0]+12,v:.55,d:2.2});t+=n[1];});
  prog.forEach(function(c,i){var b=i*2,ch=CH[c];ev.push({t:b,m:ch[0]+12,v:.28,d:2.6});ch[1].forEach(function(m){ev.push({t:b+1,m:m+12,v:.16,d:2});});});
  var LOOP=t+2; ev.sort(function(a,b){return a.t-b.t});
  function hz(m){return 440*Math.pow(2,(m-69)/12)}
  function tine(when,m,vel,dur){
    var f=hz(m), g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,when);
    g.gain.exponentialRampToValueAtTime(vel,when+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
    g.connect(master);
    [[1,1,dur],[2,.22,dur*.6],[4.2,.07,.35]].forEach(function(p){
      var o=ctx.createOscillator(), og=ctx.createGain();
      o.type='sine'; o.frequency.value=f*p[0]; og.gain.value=p[1];
      o.connect(og); og.connect(g); o.start(when); o.stop(when+dur+.05);
    });
  }
  function tick(){
    var ahead=ctx.currentTime+0.25;
    while(true){
      var e=ev[idx], at=loopStart+e.t*B;
      if(at>ahead) break;
      if(at>=ctx.currentTime-0.05) tine(at,e.m,e.v,e.d);
      idx++; if(idx>=ev.length){idx=0;loopStart+=LOOP*B;}
    }
  }
  function impulse(sec){
    var len=ctx.sampleRate*sec, buf=ctx.createBuffer(2,len,ctx.sampleRate);
    for(var c=0;c<2;c++){var d=buf.getChannelData(c);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
    return buf;
  }
  function startMusic(){
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    try{
      ctx=new AC();
      master=ctx.createGain(); master.gain.value=0.0001;
      var dry=ctx.createGain(); dry.gain.value=.8;
      var rev=ctx.createConvolver(); rev.buffer=impulse(2.4);
      wet=ctx.createGain(); wet.gain.value=.35;
      master.connect(dry); dry.connect(ctx.destination);
      master.connect(rev); rev.connect(wet); wet.connect(ctx.destination);
      master.gain.exponentialRampToValueAtTime(0.16,ctx.currentTime+1.5);
      loopStart=ctx.currentTime+0.3; idx=0;
      timer=setInterval(tick,90); tick();
      if(ctx.state==='suspended') ctx.resume();
      return true;
    }catch(e){return false}
  }
  function setOn(on){
    wantOn=on; btn.setAttribute('aria-pressed',on?'true':'false');
    btn.setAttribute('aria-label',on?'Silenciar música':'Activar música');
    if(!ctx) return;
    if(on){ctx.resume();} else {ctx.suspend();}
  }
  btn.addEventListener('click',function(){setOn(!wantOn)});
  document.addEventListener('visibilitychange',function(){
    if(!ctx) return;
    if(document.hidden) ctx.suspend(); else if(wantOn) ctx.resume();
  });

  /* ---- opening ---- */
  var opened=false;
  cover.addEventListener('click',function(){
    if(opened) return; opened=true;
    if(startMusic()) btn.hidden=false;
    cover.classList.add('opening');
    setTimeout(function(){cover.classList.add('gone');root.classList.remove('locked');},reduce?200:900);
    setTimeout(function(){cover.hidden=true;},reduce?600:1700);
  });
})();
</script>
